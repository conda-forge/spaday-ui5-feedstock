context:
  version: "0.3.0"

package:
  name: spaday-ui5
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/f0/c3/aca96039973fce063654680fe8b92ec7c12e185a40a6f9b495852853ac2c/spaday_ui5-${{ version }}.tar.gz
  sha256: 4d5a236305e59340f2d50b2b1d71cbd9740bb319296c16db8be22eb478188d51

build:
  number: 0
  noarch: python
  script:
    env:
      SKIP_HATCH_JS: "1"
    content:
      - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-js
  run:
    - python >=${{ python_min }}
    - spaday >=0.11.1,<1.0

tests:
  - python:
      imports:
        - spaday_ui5
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: UI5 components and browser assets for spaday
  homepage: https://github.com/1kbgz/spaday-ui5
  repository: https://github.com/1kbgz/spaday-ui5

extra:
  recipe-maintainers:
    - timkpaine
